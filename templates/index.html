<!-- =========================================================
AUTOMATION STUDIO X PRO
LADDER REAL FUNCIONAL ESTILO TIA PORTAL
========================================================= -->

<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Automation Studio X PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ========================================================= */

:root{

--bg:#050b14;
--panel:#0f1725;
--panel2:#111d30;
--line:#22354c;
--text:#dce9ff;

--green:#00ff99;
--red:#ff3d5e;
--blue:#00c3ff;
--yellow:#ffcc00;

}

/* ========================================================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#050b14;

font-family:Inter,sans-serif;

color:white;

overflow:hidden;

}

/* ========================================================= */

header{

height:70px;

background:#09111d;

display:flex;
justify-content:space-between;
align-items:center;

padding:0 20px;

border-bottom:1px solid #1e3248;

}

header h1{

font-family:Orbitron;

color:var(--green);

font-size:20px;

}

.top{

display:flex;
gap:10px;

}

.status{

padding:10px 14px;

background:#101b2b;

border-radius:10px;

border:1px solid #20344a;

font-size:12px;

}

.online{
color:lime;
}

.offline{
color:red;
}

/* ========================================================= */

.wrapper{

display:flex;

height:calc(100vh - 70px);

}

/* ========================================================= */

.sidebar{

width:250px;

background:#09111d;

padding:20px;

border-right:1px solid #1e3248;

}

.sidebar button{

width:100%;

margin-bottom:10px;

padding:15px;

background:#101b2b;

border:none;

border-radius:12px;

color:white;

cursor:pointer;

font-weight:700;

}

.sidebar button:hover{

background:#00ff99;

color:black;

}

/* ========================================================= */

.main{

flex:1;

padding:20px;

overflow:auto;

}

/* ========================================================= */

.card{

background:#101b2b;

border-radius:15px;

padding:20px;

border:1px solid #20344a;

margin-bottom:20px;

}

.card h2{

margin-bottom:20px;

color:var(--green);

font-family:Orbitron;

}

/* =========================================================
LADDER REAL
========================================================= */

.ladder{

background:#f5f5f5;

padding:30px;

border-radius:10px;

overflow:auto;

min-height:500px;

}

/* ========================================================= */

.rung{

display:flex;

align-items:center;

margin-bottom:45px;

min-height:70px;

}

/* ========================================================= */

.rail{

width:5px;

height:70px;

background:#444;

}

/* ========================================================= */

.wire{

height:3px;

background:#444;

flex:1;

}

/* =========================================================
NO CONTACT
========================================================= */

.contact{

width:100px;
height:45px;

position:relative;

display:flex;
justify-content:center;
align-items:center;

font-size:12px;

margin:0 10px;

font-weight:bold;

color:#111;

}

.contact.no::before,
.contact.no::after{

content:"";

position:absolute;

width:3px;
height:45px;

background:#444;

}

.contact.no::before{
left:18px;
}

.contact.no::after{
right:18px;
}

/* =========================================================
NC CONTACT
========================================================= */

.contact.nc::before,
.contact.nc::after{

content:"";

position:absolute;

width:3px;
height:45px;

background:#444;

}

.contact.nc::before{
left:18px;
}

.contact.nc::after{
right:18px;
}

.contact.nc .slash{

position:absolute;

width:55px;
height:3px;

background:#444;

transform:rotate(-45deg);

}

/* =========================================================
COIL
========================================================= */

.coil{

width:110px;
height:50px;

position:relative;

display:flex;
justify-content:center;
align-items:center;

margin:0 10px;

font-size:12px;

font-weight:bold;

color:#111;

}

.coil::before,
.coil::after{

content:"";

position:absolute;

width:30px;
height:45px;

border:3px solid #444;

border-radius:50%;

}

.coil::before{
left:8px;
border-right:none;
}

.coil::after{
right:8px;
border-left:none;
}

/* =========================================================
TIMER
========================================================= */

.timer{

width:130px;
height:70px;

border:3px solid #444;

display:flex;
justify-content:center;
align-items:center;
flex-direction:column;

font-size:11px;

background:white;

margin:0 10px;

color:black;

font-weight:bold;

}

/* ========================================================= */

.active{

filter:drop-shadow(0 0 8px lime);

}

/* ========================================================= */

.addr{

position:absolute;

top:-18px;

font-size:11px;

color:#008000;

font-weight:bold;

}

/* ========================================================= */

.controls{

display:flex;
gap:10px;
flex-wrap:wrap;

margin-bottom:20px;

}

.btn{

padding:12px 16px;

border:none;

border-radius:10px;

font-weight:bold;

cursor:pointer;

}

.green{
background:lime;
}

.red{
background:red;
color:white;
}

.blue{
background:deepskyblue;
color:white;
}

.yellow{
background:gold;
}

/* ========================================================= */

.motor{

width:250px;
height:150px;

background:linear-gradient(145deg,#5d6877,#313844);

border-radius:20px;

position:relative;

overflow:hidden;

margin:auto;

}

.fan{

position:absolute;

width:80px;
height:80px;

border-radius:50%;

border:6px solid #bbb;

left:20px;
top:35px;

animation:spin .4s linear infinite;

animation-play-state:paused;

}

.fan::before,
.fan::after{

content:"";

position:absolute;

width:6px;
height:70px;

background:#ccc;

left:50%;
top:50%;

transform:translate(-50%,-50%);

}

.fan::after{
transform:translate(-50%,-50%) rotate(90deg);
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

/* ========================================================= */

.lights{

display:flex;
justify-content:center;
gap:20px;

margin-top:20px;

}

.light{

width:35px;
height:35px;

border-radius:50%;

background:#333;

}

.on-green{
background:lime;
box-shadow:0 0 20px lime;
}

.on-red{
background:red;
box-shadow:0 0 20px red;
}

.on-blue{
background:deepskyblue;
box-shadow:0 0 20px deepskyblue;
}

</style>

</head>

<body>

<header>

<h1>AUTOMATION STUDIO X PRO</h1>

<div class="top">

<div class="status online">
CPU RUN
</div>

<div class="status offline" id="plcStatus">
PLC STOP
</div>

</div>

</header>

<div class="wrapper">

<!-- =========================================================
SIDEBAR
========================================================= -->

<div class="sidebar">

<button onclick="showPage('motorPage')">
🏭 Motor
</button>

<button onclick="showPage('ladderPage')">
🪜 Ladder Editor
</button>

</div>

<!-- =========================================================
MAIN
========================================================= -->

<div class="main">

<!-- =========================================================
MOTOR
========================================================= -->

<div class="page" id="motorPage">

<div class="card">

<h2>MOTOR INDUSTRIAL</h2>

<div class="motor">

<div class="fan" id="fan"></div>

</div>

<div class="lights">

<div class="light" id="greenLight"></div>

<div class="light" id="redLight"></div>

<div class="light" id="blueLight"></div>

</div>

<br>

<div class="controls">

<button class="btn green" onclick="toggleInput('I0.0')">
START I0.0
</button>

<button class="btn red" onclick="toggleInput('I0.1')">
STOP I0.1
</button>

<button class="btn yellow" onclick="toggleInput('I0.2')">
EMG I0.2
</button>

</div>

</div>

</div>

<!-- =========================================================
LADDER PAGE
========================================================= -->

<div class="page" id="ladderPage" style="display:none">

<div class="card">

<h2>LADDER EDITOR REAL</h2>

<div class="controls">

<button class="btn green" onclick="addNO()">
+ NO
</button>

<button class="btn yellow" onclick="addNC()">
+ NC
</button>

<button class="btn blue" onclick="addTON()">
+ TON
</button>

<button class="btn red" onclick="simulatePLC()">
SIMULAR
</button>

</div>

<div class="ladder" id="ladder">

<!-- =========================================================
RUNG 1
========================================================= -->

<div class="rung">

<div class="rail"></div>

<div class="wire"></div>

<div class="contact no">

<div class="addr">%I0.0</div>

I0.0

</div>

<div class="wire"></div>

<div class="contact nc">

<div class="addr">%I0.1</div>

<div class="slash"></div>

/I0.1

</div>

<div class="wire"></div>

<div class="contact nc">

<div class="addr">%I0.2</div>

<div class="slash"></div>

/I0.2

</div>

<div class="wire"></div>

<div class="coil">

<div class="addr">%Q0.0</div>

Q0.0

</div>

<div class="wire"></div>

<div class="rail"></div>

</div>

<!-- =========================================================
RUNG 2
========================================================= -->

<div class="rung">

<div class="rail"></div>

<div class="wire"></div>

<div class="contact no">

<div class="addr">%Q0.0</div>

Q0.0

</div>

<div class="wire"></div>

<div class="coil">

<div class="addr">%Q0.1</div>

Q0.1

</div>

<div class="wire"></div>

<div class="rail"></div>

</div>

<!-- =========================================================
RUNG 3
========================================================= -->

<div class="rung">

<div class="rail"></div>

<div class="wire"></div>

<div class="contact nc">

<div class="addr">%Q0.0</div>

<div class="slash"></div>

/Q0.0

</div>

<div class="wire"></div>

<div class="coil">

<div class="addr">%Q0.2</div>

Q0.2

</div>

<div class="wire"></div>

<div class="rail"></div>

</div>

</div>

</div>

</div>

</div>

</div>

<script>

/* =========================================================
PAGES
========================================================= */

function showPage(id){

document.querySelectorAll(".page")
.forEach(p=>p.style.display="none")

document.getElementById(id)
.style.display="block"

}

/* =========================================================
PLC MEMORY
========================================================= */

const PLC={

inputs:{
"I0.0":false,
"I0.1":false,
"I0.2":false
},

outputs:{
"Q0.0":false,
"Q0.1":false,
"Q0.2":false,
"Q0.3":false
}

}

/* =========================================================
INPUTS
========================================================= */

function toggleInput(addr){

PLC.inputs[addr]=!PLC.inputs[addr]

runPLC()

}

/* =========================================================
EVALUATE CONTACT
========================================================= */

function getValue(address){

let inverted=false

if(address.startsWith("/")){

inverted=true

address=address.replace("/","")

}

let value=false

if(PLC.inputs[address]!==undefined){

value=PLC.inputs[address]

}

if(PLC.outputs[address]!==undefined){

value=PLC.outputs[address]

}

if(inverted){
return !value
}

return value

}

/* =========================================================
PLC ENGINE
========================================================= */

function runPLC(){

/* RESET OUTPUTS */

for(let q in PLC.outputs){

PLC.outputs[q]=false

}

const rungs=document.querySelectorAll(".rung")

rungs.forEach(rung=>{

let power=true

const elements=rung.children

elements.forEach(el=>{

/* =====================================================
CONTACT
===================================================== */

if(el.classList.contains("contact")){

let txt=el.innerText
.trim()
.split("\n")
.pop()

let state=getValue(txt)

if(state){

el.classList.add("active")

}else{

el.classList.remove("active")

power=false

}

}

/* =====================================================
COIL
===================================================== */

if(el.classList.contains("coil")){

let txt=el.innerText
.trim()
.split("\n")
.pop()

if(PLC.outputs[txt]!==undefined){

PLC.outputs[txt]=power

}

if(power){

el.classList.add("active")

}else{

el.classList.remove("active")

}

}

})

})

updateOutputs()

}

/* =========================================================
OUTPUTS
========================================================= */

function updateOutputs(){

/* MOTOR */

if(PLC.outputs["Q0.0"]){

document.getElementById("fan")
.style.animationPlayState="running"

document.getElementById("plcStatus")
.innerHTML="PLC RUN"

document.getElementById("plcStatus")
.classList.remove("offline")

document.getElementById("plcStatus")
.classList.add("online")

}else{

document.getElementById("fan")
.style.animationPlayState="paused"

document.getElementById("plcStatus")
.innerHTML="PLC STOP"

document.getElementById("plcStatus")
.classList.remove("online")

document.getElementById("plcStatus")
.classList.add("offline")

}

/* LIGHTS */

document.getElementById("greenLight")
.className=
PLC.outputs["Q0.1"]
?
"light on-green"
:
"light"

document.getElementById("redLight")
.className=
PLC.outputs["Q0.2"]
?
"light on-red"
:
"light"

document.getElementById("blueLight")
.className=
PLC.outputs["Q0.3"]
?
"light on-blue"
:
"light"

}

/* =========================================================
BUTTONS
========================================================= */

function addNO(){

const rung=document.createElement("div")

rung.className="rung"

rung.innerHTML=`

<div class="rail"></div>

<div class="wire"></div>

<div class="contact no">

<div class="addr">%I0.0</div>

I0.0

</div>

<div class="wire"></div>

<div class="coil">

<div class="addr">%Q0.3</div>

Q0.3

</div>

<div class="wire"></div>

<div class="rail"></div>

`

document.getElementById("ladder")
.appendChild(rung)

}

/* ========================================================= */

function addNC(){

const rung=document.createElement("div")

rung.className="rung"

rung.innerHTML=`

<div class="rail"></div>

<div class="wire"></div>

<div class="contact nc">

<div class="addr">%I0.1</div>

<div class="slash"></div>

/I0.1

</div>

<div class="wire"></div>

<div class="coil">

<div class="addr">%Q0.3</div>

Q0.3

</div>

<div class="wire"></div>

<div class="rail"></div>

`

document.getElementById("ladder")
.appendChild(rung)

}

/* ========================================================= */

function addTON(){

const rung=document.createElement("div")

rung.className="rung"

rung.innerHTML=`

<div class="rail"></div>

<div class="wire"></div>

<div class="contact no">

<div class="addr">%I0.0</div>

I0.0

</div>

<div class="wire"></div>

<div class="timer">

TON

T1

5s

</div>

<div class="wire"></div>

<div class="coil">

<div class="addr">%Q0.3</div>

Q0.3

</div>

<div class="wire"></div>

<div class="rail"></div>

`

document.getElementById("ladder")
.appendChild(rung)

}

/* ========================================================= */

function simulatePLC(){

runPLC()

}

/* =========================================================
SCAN CYCLE
========================================================= */

setInterval(()=>{

runPLC()

},100)

</script>

</body>
</html>
