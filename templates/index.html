<!DOCTYPE html>
<html>

<head>

    <title>PLC WEB</title>

    <style>

        body{
            background:#111;
            color:white;
            font-family:Arial;
            text-align:center;
            padding-top:50px;
        }

        h1{
            color:lime;
        }

        .panel{
            background:#222;
            width:400px;
            margin:auto;
            padding:30px;
            border-radius:20px;
        }

        button{
            padding:20px;
            width:150px;
            border:none;
            border-radius:10px;
            font-size:20px;
            cursor:pointer;
            margin:10px;
        }

        .start{
            background:green;
            color:white;
        }

        .stop{
            background:red;
            color:white;
        }

        .motor{
            width:100px;
            height:100px;
            background:gray;
            border-radius:50%;
            margin:auto;
            margin-top:30px;
        }

    </style>

</head>

<body>

    <div class="panel">

        <h1>PLC VIRTUAL</h1>

        <p>Panel de Control</p>

        <button class="start">
            START
        </button>

        <button class="stop">
            STOP
        </button>

        <div class="motor"></div>

    </div>

</body>

</html>
