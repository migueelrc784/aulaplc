<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AULA PLC HMI - SCADA PRO</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#070b10;color:#fff;overflow:hidden}

/* TOP */
.topbar{
display:flex;justify-content:space-between;align-items:center;
height:70px;padding:0 20px;
background:#0f1722;border-bottom:2px solid #00ff88;
}
.logo{color:#00ff88;font-size:20px;font-weight:bold}
.badges{display:flex;gap:10px}
.badge{padding:8px 12px;background:#1b2635;border-radius:10px;font-size:12px}

/* LAYOUT */
.container{display:flex;height:calc(100vh - 70px)}

.sidebar{
width:220px;background:#0d141f;
padding:15px;border-right:1px solid #1c2a3a
}
.sidebar button{
width:100%;padding:12px;margin-bottom:10px;
background:#162233;border:none;border-radius:10px;
color:#fff;cursor:pointer;transition:.2s
}
.sidebar button:hover{background:#00ff88;color:#000}

/* MAIN */
.main{flex:1;padding:15px}

/* PAGES */
.page{display:none}
.page.active{display:block}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px
}

.card{
background:#0f1a28;
border:1px solid #1d2c3f;
border-radius:15px;
padding:15px
}

.title{color:#00ff88;margin-bottom:10px}

/* MOTOR */
.motor{
width:120px;height:120px;
border-radius:50%;
margin:auto;
border:8px solid #333;
background:#222;
animation:spin 1.5s linear infinite;
animation-play-state:paused
}
@keyframes spin{100%{transform:rotate(360deg)}}

/* BUTTONS */
.btns{display:flex;gap:10px;justify-content:center;margin-top:10px}
button.ctrl{
padding:10px 15px;border:none;border-radius:10px;
cursor:pointer;font-weight:bold
}
.start{background:#00c853}
.stop{background:#d50000}

/* SENSORS */
.sensors{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sensor{
background:#162233;padding:10px;border-radius:10px;text-align:center
}
.light{
width:14px;height:14px;border-radius:50%;
background:#444;margin:8px auto
}
.light.on{background:#00ff88;box-shadow:0 0 10px #00ff88}

/* BIG COUNTER */
.big{
font-size:55px;
text-align:center;
color:#00ff88
}

/* GRAPH */
.graph{
height:120px;
background:linear-gradient(#1b2a3d 1px,transparent 1px),
linear-gradient(90deg,#1b2a3d 1px,transparent 1px);
background-size:20px 20px;
position:relative;overflow:hidden
}
.line{
position:absolute;width:120%;height:3px;
background:#00ff88;
top:50%;left:-50px;
animation:move 2s linear infinite;
animation-play-state:paused
}
@keyframes move{100%{transform:translateX(100px)}}

/* ALARM */
.alarm{
background:#2a0f14;
border:1px solid red;
padding:15px;border-radius:10px
}

.ok{color:#00ff88}
.bad{color:red}

/* LOG */
.log{
height:200px;
overflow:auto;
background:#0b121b;
padding:10px;
border-radius:10px;
font-size:12px
}
.log p{margin-bottom:5px;color:#aaa}
</style>
</head>

<body>

<div class="topbar">
<div class="logo">⚡ AULA PLC SCADA SYSTEM</div>

<div class="badges">
<div class="badge" id="cpu">CPU OK</div>
<div class="badge" id="plc">PLC STOP</div>
<div class="badge" id="net">NET OK</div>
</div>
</div>

<div class="container">

<div class="sidebar">
<button onclick="show('dash')">Dashboard</button>
<button onclick="show('plc')">PLC</button>
<button onclick="show('alarm')">Alarmas</button>
<button onclick="show('log')">Historial</button>
</div>

<div class="main">

<!-- DASH -->
<div id="dash" class="page active">

<div class="grid">

<div class="card">
<div class="title">Motor Principal</div>
<div class="motor" id="motor"></div>

<div class="btns">
<button class="ctrl start" onclick="start()">START</button>
<button class="ctrl stop" onclick="stop()">STOP</button>
</div>
</div>

<div class="card">
<div class="title">Sensores</div>
<div class="sensors">
<div class="sensor">S1<div class="light"></div></div>
<div class="sensor">S2<div class="light"></div></div>
<div class="sensor">S3<div class="light"></div></div>
<div class="sensor">S4<div class="light"></div></div>
</div>
</div>

<div class="card">
<div class="title">Producción</div>
<div class="big" id="count">0</div>
<div class="graph"><div class="line"></div></div>
</div>

</div>

</div>

<!-- PLC -->
<div id="plc" class="page">
<div class="card">
<div class="title">Estado PLC</div>
<p id="plcState" class="bad">STOPPED</p>
</div>
</div>

<!-- ALARM -->
<div id="alarm" class="page">
<div class="card alarm">
<div class="title">Alarmas</div>
<p id="alarmText" class="bad">SIN ALARMAS</p>
</div>
</div>

<!-- LOG -->
<div id="log" class="page">
<div class="card">
<div class="title">Historial de Eventos</div>
<div class="log" id="logBox"></div>
</div>
</div>

</div>
</div>

<script>

let running=false
let count=0
let timer

const motor=document.getElementById("motor")
const line=document.querySelector(".line")
const counter=document.getElementById("count")
const lights=document.querySelectorAll(".light")
const plcState=document.getElementById("plcState")
const alarmText=document.getElementById("alarmText")
const logBox=document.getElementById("logBox")

function log(msg){
let p=document.createElement("p")
p.innerText=new Date().toLocaleTimeString()+" - "+msg
logBox.prepend(p)
}

function show(page){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"))
document.getElementById(page).classList.add("active")
}

function start(){

if(running) return
running=true

motor.style.animationPlayState="running"
line.style.animationPlayState="running"

document.getElementById("plc").innerText="PLC RUN"

plcState.innerText="RUNNING"
plcState.className="ok"

alarmText.innerText="SYSTEM OK"
alarmText.className="ok"

lights.forEach(l=>l.classList.add("on"))

log("Sistema iniciado")

timer=setInterval(()=>{

count++
counter.innerText=count

// sensores aleatorios
lights.forEach(l=>{
if(Math.random()>0.7){
l.classList.toggle("on")
}
})

},700)

}

function stop(){

running=false

motor.style.animationPlayState="paused"
line.style.animationPlayState="paused"

document.getElementById("plc").innerText="PLC STOP"

plcState.innerText="STOPPED"
plcState.className="bad"

alarmText.innerText="SYSTEM STOPPED"
alarmText.className="bad"

lights.forEach(l=>l.classList.remove("on"))

log("Sistema detenido")

clearInterval(timer)

}

</script>

</body>
</html>
