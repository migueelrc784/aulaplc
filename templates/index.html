<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AulaPLC | SCADA Industrial</title>

<style>
:root{
  --bg:#0a0f18;
  --panel:#111a2b;
  --panel2:#0e1624;
  --accent:#00ff99;
  --danger:#ff3b3b;
  --text:#d6e2ff;
  --border:#1f2b3d;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Arial}

body{
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
header{
  height:65px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 20px;
  background:var(--panel);
  border-bottom:1px solid var(--accent);
}

header h1{
  font-size:18px;
  color:var(--accent);
  letter-spacing:1px;
}

.statusbar{
  display:flex;
  gap:10px;
}

.status{
  padding:6px 10px;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:8px;
  font-size:12px;
}

/* LAYOUT */
.container{
  display:flex;
  height:calc(100vh - 65px);
}

/* SIDEBAR */
.sidebar{
  width:230px;
  background:var(--panel2);
  border-right:1px solid var(--border);
  padding:15px;
}

.sidebar button{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#162235;
  color:var(--text);
  transition:.2s;
}

.sidebar button:hover{
  background:var(--accent);
  color:#000;
}

/* MAIN */
.main{
  flex:1;
  padding:20px;
  overflow:auto;
}

/* CARDS */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:15px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:15px;
}

.card h3{
  color:var(--accent);
  margin-bottom:10px;
}

/* MOTOR */
.motor{
  width:110px;
  height:110px;
  margin:auto;
  border-radius:50%;
  border:8px solid #333;
  background:#1b1b1b;
  animation:spin 1.2s linear infinite;
  animation-play-state:paused;
}

@keyframes spin{
  100%{transform:rotate(360deg)}
}

/* BUTTONS */
.btns{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:10px;
}

.btn{
  padding:10px 14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.start{background:var(--accent)}
.stop{background:var(--danger);color:#fff}

/* SENSOR */
.sensors{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.sensor{
  background:var(--panel2);
  padding:10px;
  border-radius:10px;
  text-align:center;
  border:1px solid var(--border);
}

.light{
  width:12px;
  height:12px;
  border-radius:50%;
  background:#444;
  margin:8px auto;
}

.light.on{
  background:var(--accent);
  box-shadow:0 0 10px var(--accent);
}

/* BIG NUMBER */
.big{
  font-size:50px;
  text-align:center;
  color:var(--accent);
}

/* LOG */
.log{
  height:200px;
  overflow:auto;
  font-size:12px;
}

.log p{
  margin-bottom:6px;
  color:#aab6d3;
}

/* PLC STATUS */
.ok{color:var(--accent)}
.bad{color:var(--danger)}
</style>
</head>

<body>

<header>
<h1>⚙ AULA PLC - SCADA INDUSTRIAL</h1>

<div class="statusbar">
<div class="status" id="cpu">CPU OK</div>
<div class="status" id="plcStatus">PLC STOP</div>
<div class="status">NET OK</div>
</div>
</header>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<button onclick="show('dash')">Dashboard</button>
<button onclick="show('plc')">PLC Status</button>
<button onclick="show('alarm')">Alarmas</button>
<button onclick="show('log')">Eventos</button>
</div>

<!-- MAIN -->
<div class="main">

<!-- DASH -->
<div id="dash" class="page">

<div class="grid">

<div class="card">
<h3>Motor Principal</h3>
<div class="motor" id="motor"></div>

<div class="btns">
<button class="btn start" onclick="start()">START</button>
<button class="btn stop" onclick="stop()">STOP</button>
</div>
</div>

<div class="card">
<h3>Sensores Industriales</h3>
<div class="sensors">
<div class="sensor">S1<div class="light"></div></div>
<div class="sensor">S2<div class="light"></div></div>
<div class="sensor">S3<div class="light"></div></div>
<div class="sensor">S4<div class="light"></div></div>
</div>
</div>

<div class="card">
<h3>Producción</h3>
<div class="big" id="count">0</div>
</div>

</div>

</div>

<!-- PLC -->
<div id="plc" class="page" style="display:none">
<div class="card">
<h3>Estado PLC</h3>
<p id="plcText" class="bad">STOPPED</p>
</div>
</div>

<!-- ALARMAS -->
<div id="alarm" class="page" style="display:none">
<div class="card">
<h3>Alarmas del Sistema</h3>
<p id="alarmText" class="bad">SIN ALARMAS</p>
</div>
</div>

<!-- LOG -->
<div id="log" class="page" style="display:none">
<div class="card">
<h3>Historial</h3>
<div class="log" id="logBox"></div>
</div>
</div>

</div>
</div>

<script>

let running=false
let count=0
let timer

const motor=document.getElementById("motor")
const lights=document.querySelectorAll(".light")
const counter=document.getElementById("count")
const logBox=document.getElementById("logBox")

function log(msg){
let p=document.createElement("p")
p.innerText=new Date().toLocaleTimeString()+" - "+msg
logBox.prepend(p)
}

function show(page){
document.querySelectorAll(".page").forEach(p=>p.style.display="none")
document.getElementById(page).style.display="block"
}

function start(){

if(running) return
running=true

motor.style.animationPlayState="running"
document.getElementById("plcStatus").innerText="PLC RUN"

log("Sistema iniciado")

timer=setInterval(()=>{

count++
counter.innerText=count

lights.forEach(l=>{
if(Math.random()>0.6) l.classList.toggle("on")
})

},600)

}

function stop(){

running=false
motor.style.animationPlayState="paused"

document.getElementById("plcStatus").innerText="PLC STOP"

log("Sistema detenido")

clearInterval(timer)

lights.forEach(l=>l.classList.remove("on"))
}

</script>

</body>
</html>
