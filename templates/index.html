<!-- =========================================================
TIA PORTAL STYLE LADDER CSS
ESTILO REAL SIEMENS
========================================================= -->

<style>

/* =========================================================
LADDER REAL STYLE
========================================================= */

.ladder-workspace{

background:#f3f3f3;

border-radius:10px;

padding:30px;

overflow:auto;

min-height:700px;

font-family:Arial;

}

/* =========================================================
RUNG
========================================================= */

.rung{

display:flex;

align-items:center;

position:relative;

margin-bottom:45px;

min-height:70px;

}

/* =========================================================
POWER RAILS
========================================================= */

.left-rail,
.right-rail{

width:5px;

background:#444;

height:70px;

}

/* =========================================================
WIRE
========================================================= */

.wire{

height:3px;

background:#444;

flex:1;

}

/* =========================================================
CONTACTS
========================================================= */

.contact{

width:90px;
height:40px;

position:relative;

display:flex;
justify-content:center;
align-items:center;

font-size:12px;

margin:0 10px;

cursor:pointer;

user-select:none;

}

/* NORMAL OPEN */

.contact.no::before,
.contact.no::after{

content:"";

position:absolute;

width:3px;
height:40px;

background:#444;

}

.contact.no::before{
left:18px;
}

.contact.no::after{
right:18px;
}

/* NORMAL CLOSED */

.contact.nc::before,
.contact.nc::after{

content:"";

position:absolute;

width:3px;
height:40px;

background:#444;

}

.contact.nc::before{
left:18px;
}

.contact.nc::after{
right:18px;
}

.contact.nc .slash{

position:absolute;

width:55px;
height:3px;

background:#444;

transform:rotate(-45deg);

}

/* =========================================================
COIL
========================================================= */

.coil{

width:100px;
height:50px;

position:relative;

display:flex;
justify-content:center;
align-items:center;

font-size:12px;

margin:0 10px;

}

/* COIL SHAPE */

.coil::before,
.coil::after{

content:"";

position:absolute;

width:28px;
height:45px;

border:3px solid #444;

border-radius:50%;

}

.coil::before{
left:10px;
border-right:none;
}

.coil::after{
right:10px;
border-left:none;
}

/* =========================================================
TON TIMER
========================================================= */

.timer{

width:130px;
height:70px;

border:3px solid #444;

background:white;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

font-size:11px;

margin:0 10px;

position:relative;

}

/* =========================================================
ACTIVE ELEMENT
========================================================= */

.active{

filter:drop-shadow(0 0 8px lime);

}

.active .wire,
.active{
background-color:transparent;
}

/* =========================================================
ADDRESS
========================================================= */

.addr{

position:absolute;

top:-18px;

font-size:11px;

color:#008000;

font-weight:bold;

}

.symbol{

font-size:11px;

margin-top:5px;

}

/* =========================================================
TIA STYLE TEXT
========================================================= */

.tia-title{

font-size:14px;

font-weight:bold;

margin-bottom:20px;

color:#222;

}

</style>

<!-- =========================================================
TIA PORTAL STYLE HTML
========================================================= -->

<div class="ladder-workspace">

<div class="tia-title">
Main [OB1]
</div>

<div class="rung">

<!-- NO -->

<div class="slash"></div>

</div>

</div>

<div class="wire"></div>

<div class="coil active">

</div>

<div class="wire"></div>
