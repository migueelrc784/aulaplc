<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PLC AI SYSTEM</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#0b0f14;
            font-family:Arial, Helvetica, sans-serif;
            color:white;
            overflow:hidden;
        }

        .topbar{
            width:100%;
            height:70px;
            background:#121922;
            border-bottom:2px solid #00ff88;
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:0 30px;
        }

        .logo{
            font-size:30px;
            font-weight:bold;
            color:#00ff88;
        }

        .status{
            display:flex;
            gap:15px;
        }

        .status-card{
            background:#1b2430;
            padding:10px 20px;
            border-radius:12px;
            border:1px solid #2d3948;
        }

        .container{
            display:flex;
            height:calc(100vh - 70px);
        }

        .sidebar{
            width:250px;
            background:#10161f;
            border-right:2px solid #1d2633;
            padding:20px;
        }

        .sidebar h2{
            color:#00ff88;
            margin-bottom:25px;
        }

        .sidebar button{
            width:100%;
            padding:15px;
            margin-bottom:15px;
            border:none;
            border-radius:12px;
            background:#1a2330;
            color:white;
            cursor:pointer;
            transition:0.3s;
            font-size:16px;
        }

        .sidebar button:hover{
            background:#00ff88;
            color:black;
        }

        .main{
            flex:1;
            padding:30px;
        }

        .dashboard{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:25px;
        }

        .panel{
            background:#101826;
            border:1px solid #243244;
            border-radius:22px;
            padding:25px;
            box-shadow:0 0 25px rgba(0,0,0,0.5);
        }

        .panel h2{
            color:#00ff88;
            margin-bottom:20px;
        }

        .motor-box{
            text-align:center;
        }

        .motor{
            width:150px;
            height:150px;
            margin:auto;
            border-radius:50%;
            background:linear-gradient(145deg,#444,#222);
            border:10px solid #666;
            box-shadow:none;
            animation:spin 2s linear infinite;
            animation-play-state: paused;
        }

        @keyframes spin{

            from{
                transform:rotate(0deg);
            }

            to{
                transform:rotate(360deg);
            }

        }

        .controls{
            display:flex;
            justify-content:center;
            gap:20px;
            margin-top:30px;
        }

        .controls button{
            border:none;
            padding:15px 30px;
            border-radius:12px;
            color:white;
            font-size:20px;
            cursor:pointer;
            transition:0.3s;
        }

        .controls button:hover{
            transform:scale(1.05);
        }

        .start{
            background:#00c853;
        }

        .stop{
            background:#d50000;
        }

        .sensor-grid{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:15px;
        }

        .sensor{
            background:#1a2330;
            padding:20px;
            border-radius:15px;
            text-align:center;
        }

        .sensor-light{
            width:25px;
            height:25px;
            background:gray;
            border-radius:50%;
            margin:15px auto;
            transition:0.3s;
        }

        .sensor-light.active{
            background:lime;
            box-shadow:0 0 20px lime;
        }

        .production-number{
            font-size:70px;
            color:#00ff88;
        }

        .graph{
            width:100%;
            height:200px;
            margin-top:20px;
            border-radius:15px;
            overflow:hidden;
            background:
            linear-gradient(to right,#1f2a39 1px,transparent 1px),
            linear-gradient(to bottom,#1f2a39 1px,transparent 1px);

            background-size:20px 20px;
            position:relative;
        }

        .line{
            position:absolute;
            width:120%;
            height:4px;
            background:#00ff88;
            top:50%;
            left:-50px;
            animation:wave 3s linear infinite;
            animation-play-state: paused;
        }

        @keyframes wave{

            from{
                transform:translateX(-100px);
            }

            to{
                transform:translateX(100px);
            }

        }

        .alarm{
            margin-top:25px;
            background:#2b0d0d;
            border:1px solid red;
            border-radius:18px;
            padding:25px;
        }

        .alarm h2{
            color:red;
            margin-bottom:10px;
        }

        .alarm-status{
            color:#00ff88;
            font-weight:bold;
        }

    </style>

</head>

<body>

    <div class="topbar">

        <div class="logo">
            PLC AI SYSTEM
        </div>

        <div class="status">

            <div class="status-card">
                CPU: ONLINE
            </div>

            <div class="status-card">
                PLC: RUN
            </div>

            <div class="status-card">
                NETWORK: OK
            </div>

        </div>

    </div>

    <div class="container">

        <div class="sidebar">

            <h2>MENÚ</h2>

            <button>Dashboard</button>
            <button>PLC</button>
            <button>HMI</button>
            <button>Alarmas</button>
            <button>Historial</button>
            <button>Configuración</button>

        </div>

        <div class="main">

            <div class="dashboard">

                <div class="panel motor-box">

                    <h2>Motor Principal</h2>

                    <div class="motor"></div>

                    <div class="controls">

                        <button class="start">
                            START
                        </button>

                        <button class="stop">
                            STOP
                        </button>

                    </div>

                </div>

                <div class="panel">

                    <h2>Sensores</h2>

                    <div class="sensor-grid">

                        <div class="sensor">
                            Sensor 1
                            <div class="sensor-light"></div>
                        </div>

                        <div class="sensor">
                            Sensor 2
                            <div class="sensor-light"></div>
                        </div>

                        <div class="sensor">
                            Sensor 3
                            <div class="sensor-light"></div>
                        </div>

                        <div class="sensor">
                            Sensor 4
                            <div class="sensor-light"></div>
                        </div>

                    </div>

                </div>

                <div class="panel">

                    <h2>Producción</h2>

                    <div class="production-number" id="counter">
                        0
                    </div>

                    <p>Cajas procesadas</p>

                    <div class="graph">
                        <div class="line"></div>
                    </div>

                </div>

            </div>

            <div class="alarm">

                <h2>ALARMAS ACTIVAS</h2>

                <p class="alarm-status" id="alarmText">
                    Sistema detenido
                </p>

            </div>

        </div>

    </div>

    <script>

        const motor = document.querySelector(".motor")

        const startBtn = document.querySelector(".start")

        const stopBtn = document.querySelector(".stop")

        const sensors = document.querySelectorAll(".sensor-light")

        const line = document.querySelector(".line")

        const counter = document.getElementById("counter")

        const alarmText = document.getElementById("alarmText")

        let running = false

        let production = 0

        let interval

        startBtn.onclick = () => {

            if(running) return

            running = true

            motor.style.animationPlayState = "running"

            motor.style.boxShadow = "0 0 40px lime"

            line.style.animationPlayState = "running"

            alarmText.innerText = "Sistema en funcionamiento"

            alarmText.style.color = "lime"

            sensors.forEach(sensor => {

                sensor.classList.add("active")

            })

            interval = setInterval(() => {

                production++

                counter.innerText = production

            }, 1000)

        }

        stopBtn.onclick = () => {

            running = false

            motor.style.animationPlayState = "paused"

            motor.style.boxShadow = "none"

            line.style.animationPlayState = "paused"

            alarmText.innerText = "Sistema detenido"

            alarmText.style.color = "red"

            sensors.forEach(sensor => {

                sensor.classList.remove("active")

            })

            clearInterval(interval)

        }

    </script>

</body>

</html>
