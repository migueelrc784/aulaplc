<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-adsense-account" content="ca-pub-1844056830018969">
  <title>{% block title %}AULAPLC{% endblock %}</title>

  <!-- CANONICAL: cada página define la suya -->
  <link rel="canonical" href="https://aulaplc.com{% block canonical %}/{% endblock %}">

  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">

  <!-- SEO base -->
  <meta name="description" content="{% block meta_description %}Aprende PLC Siemens, Ladder, HMI, SCADA y variadores. Simulador PLC online gratuito.{% endblock %}">
  <meta name="keywords" content="PLC Siemens, TIA Portal, programación Ladder, SCADA, HMI, variadores frecuencia, curso automatización industrial">
  <meta name="author" content="AulaPLC">

  <!-- OG -->
  <meta property="og:title" content="{% block og_title %}AULAPLC STUDIO X{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Simulador PLC online, cursos de Ladder, HMI, SCADA y variadores Siemens.{% endblock %}">
  <meta property="og:image" content="https://aulaplc.com/static/img/logo.png">
  <meta property="og:url" content="https://aulaplc.com{% block og_url %}/{% endblock %}">
  <meta property="og:type" content="website">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% block tw_title %}AULAPLC — Cursos PLC Industrial{% endblock %}">
  <meta name="twitter:description" content="Simulador PLC online y cursos de automatización industrial Siemens.">
  <meta name="twitter:image" content="https://aulaplc.com/static/img/logo.png">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6KP8S8FS3T"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-6KP8S8FS3T');
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ladder.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/vfd.css') }}">

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1844056830018969" crossorigin="anonymous"></script>

  {% block extra_head %}{% endblock %}

  <style>
    html, body {
      height: auto !important;
      overflow-x: hidden !important;
      overflow-y: auto !important;
    }
    main {
      display: block;
      width: 100%;
      overflow: visible !important;
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="top-header">
  <div class="header-top-bar">
    <div class="header-social">
      <a href="https://www.tiktok.com/@aulaplcweb" class="social-link" target="_blank" title="TikTok">
        <svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.76a4.85 4.85 0 0 1-1.01-.07z"/></svg>
      </a>
      <a href="https://instagram.com/aulaplc" class="social-link" target="_blank" title="Instagram">
        <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>
      </a>
      <a href="https://x.com/aulaplc" class="social-link" target="_blank" title="X / Twitter">
        <svg viewBox="0 0 24 24"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg>
      </a>
      <a href="https://www.youtube.com/@AULAPLC" class="social-link" target="_blank" title="YouTube">
        <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
      </a>
      <div class="social-divider"></div>
    </div>

    <div class="header-logo-center logo-area">
      <a href="/cursos" style="display:flex; align-items:center; gap:10px; text-decoration:none;">
        <div class="logo-icon header-logo-icon">⚡</div>
        <div class="header-logo-wordmark">
          <div class="title header-logo-name">AULAPLC STUDIO X</div>
          <div class="subtitle header-logo-sub">PLC LADDER ENGINE</div>
        </div>
      </a>
    </div>

    <div class="header-auth top-status">
      <div id="auth-area"></div>
    </div>
  </div>

  <!-- NAVEGACIÓN -->
  <div class="header-nav-bar">
    <div class="top-nav top-buttons">
      <a href="/cursos" class="nav-btn {% if request.path == '/cursos' %}active-nav{% endif %}">CURSOS</a>
      <a href="/comunidad" class="nav-btn {% if request.path == '/comunidad' %}active-nav{% endif %}">COMUNIDAD</a>
      <a href="/simulador-plc" class="nav-btn {% if request.path == '/simulador-plc' %}active-nav{% endif %}">SIMULADOR PLC</a>
      <a href="/simulador-vfd" class="nav-btn {% if request.path == '/simulador-vfd' %}active-nav{% endif %}">SIMULADOR VFD</a>
      <a href="/dudas" class="nav-btn {% if request.path == '/dudas' %}active-nav{% endif %}">DUDAS</a>
      <a href="/tienda" class="nav-btn {% if request.path == '/tienda' %}active-nav{% endif %}">TIENDA</a>
    </div>
  </div>
</header>

<!-- CONTENIDO DE CADA PÁGINA -->
<main>
  {% block content %}{% endblock %}
</main>

<!-- SCRIPTS COMUNES -->
<script src="{{ url_for('static', filename='js/logs.js') }}"></script>
<script src="{{ url_for('static', filename='js/motor.js') }}"></script>
<script src="{{ url_for('static', filename='js/plc_engine.js') }}"></script>
<script src="{{ url_for('static', filename='js/ladder.js') }}"></script>
<script src="{{ url_for('static', filename='js/vfd.js') }}"></script>
<script src="{{ url_for('static', filename='js/traducciones.js') }}"></script>
<script type="module" src="{{ url_for('static', filename='js/firebase-auth.js') }}"></script>

{% block extra_scripts %}{% endblock %}
</body>
</html>
